name: CI

on:
  pull_request:
    branches: [main, staging]
    # При смене целевой ветки нужно заново выбрать режим тестирования.
    types: [opened, reopened, synchronize, edited]
  push:
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: gift_f5_cle130_ci
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d gift_f5_cle130_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      RUN_AFFECTED_TESTS: ${{ github.event_name == 'pull_request' && github.base_ref == 'staging' }}
      # Заглушки для сборки и smoke без БД. Шаг HTTP с БД получает отдельные параметры.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      BETTER_AUTH_SECRET: ci-placeholder-secret-not-used-anywhere-000
      BETTER_AUTH_URL: http://localhost:3000
      CRON_SECRET: ci-placeholder-secret-not-used-anywhere-000
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Для diff нужны merge-коммит PR и его родители.
          fetch-depth: ${{ env.RUN_AFFECTED_TESTS == 'true' && 2 || 1 }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$RUN_AFFECTED_TESTS" == 'true' && -n "$PR_BASE_SHA" ]]; then
            npm run test:affected -- --base "$PR_BASE_SHA"
          else
            npm test
          fi

      - name: Create canary .env
        run: echo "CI_ENV_FILE_CANARY=1" > apps/web/.env

      - name: Build
        run: npm run build

      - name: Check web JS gzip budget
        run: node scripts/measure-web-size.mjs

      - name: Check standalone output
        shell: bash
        run: |
          if ! test -f apps/web/.next/standalone/apps/web/server.js; then
            echo "::error::Не найден apps/web/.next/standalone/apps/web/server.js после npm run build"
            exit 1
          fi

      - name: Check no .env in standalone
        shell: bash
        run: |
          found=$(find apps/web/.next/standalone -name '.env*' -not -path '*/node_modules/*')
          if [ -n "$found" ]; then
            echo "::error::В standalone попали файлы .env*:"
            echo "$found"
            exit 1
          fi

      - name: Smoke start standalone server
        shell: bash
        run: |
          PORT=3000 HOSTNAME=127.0.0.1 node apps/web/.next/standalone/apps/web/server.js > server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          status() { curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3000$1" || true; }
          fail() {
            echo "::error::$1"
            cat server.log
            exit 1
          }
          code=000
          for _ in $(seq 1 30); do
            code=$(status /)
            [ "$code" = "200" ] && break
            kill -0 "$SERVER_PID" 2>/dev/null || break
            sleep 1
          done
          [ "$code" = "200" ] || fail "GET / вернул $code вместо 200 (ожидание до 30 с)"
          # /register подгружает auth/env/Prisma при запросе, в отличие от prerender-страницы /.
          code=$(status /register)
          [ "$code" = "200" ] || fail "GET /register вернул $code вместо 200"
          echo "Сервер ответил 200 на / и /register"

      # CLE-103 followup: /l и /i отвечают реальным 404, а его документ несёт
      # noindex и закрытый <title> (без базы: сегмент заведомо битый).
      - name: Check public 404 and API canonicalization
        run: node apps/web/scripts/verify-public-404-http.mjs

      - name: Check public wish HTTP on disposable PostgreSQL
        env:
          DISPOSABLE_DATABASE_URL: postgresql://ci:ci@127.0.0.1:55432/gift_f5_cle130_ci
          DISPOSABLE_DIRECT_URL: postgresql://ci:ci@127.0.0.1:55432/gift_f5_cle130_ci
          DISPOSABLE_PG_CONFIRM: gift_f5_cle130_ci
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON apps/web/scripts/verify-public-wish-http.mjs
