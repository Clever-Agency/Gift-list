name: Wish expiry

# Story 2.6 / AD-16: not Vercel Cron. The schedule runs only from the default
# branch of this repository. A delayed run only postpones the archive (ARCH-A15).
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wish-expiry:
    name: wish-expiry
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Archive expired wishes
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Set the APP_URL and CRON_SECRET repository secrets"
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 60 \
            -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL%/}/api/cron/wish-expiry"
